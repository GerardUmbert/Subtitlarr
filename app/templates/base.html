<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtitlarr — {% block title %}Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_version }}" />
  <link rel="stylesheet" href="/static/css/base.css?v={{ asset_version }}" />
  <link rel="stylesheet" href="/static/css/components.css?v={{ asset_version }}" />
  <script src="/static/js/vue.global.prod.js?v={{ asset_version }}"></script>
</head>
<body>
  <div class="shell" id="shell">
    {% include "partials/sidebar.html" %}
    <script>
      // Applied synchronously, right after the sidebar markup parses —
      // before first paint — so a returning visitor with the sidebar
      // collapsed doesn't see one frame of the expanded sidebar before
      // api.js (loaded at the end of <body>) catches up. See api.js's
      // initCollapseToggle for the click handler that keeps this in sync.
      (function () {
        if (localStorage.getItem("sidebarCollapsed") !== "1") return;
        document.getElementById("shell").classList.add("sidebar-collapsed");
        var sidebar = document.getElementById("sidebar");
        sidebar.classList.add("collapsed");
        var toggle = document.getElementById("collapse-toggle");
        toggle.textContent = "▸";
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "Expand sidebar");
      })();
    </script>
    <main id="app">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/js/api.js?v={{ asset_version }}"></script>
  <script src="/static/js/toast.js?v={{ asset_version }}"></script>
  <script src="/static/js/run-events.js?v={{ asset_version }}"></script>
  <script>RunEvents.start();</script>
  {% block scripts %}{% endblock %}
</body>
</html>
