{% extends "base.html" %}
{% block title %}Jobs{% endblock %}
{% block content %}
<div id="jobs-app">
  <div class="page-head">
    <div>
      <h1>Jobs</h1>
      <p class="page-sub">Manually trigger the scheduled translation job, or reset local queue/run data if it's gotten out of sync.</p>
    </div>
  </div>

  <div class="panel-loading" v-if="pageLoading">
    <div class="loading-spinner"></div>
    <p>Loading jobs…</p>
  </div>

  <template v-else>
  <div class="panel">
    <div class="panel-body">
    <div class="panel-title">Translate next batch</div>
    <div class="panel-title-sub">Runs the same age-gated job as the cron, on demand — translates up to today's remaining daily limit, not the full backlog</div>


      <p class="field-hint">Cron: <span class="mono">{% raw %}{{ cronExpression }}{% endraw %}</span> · Age threshold: {% raw %}{{ ageThresholdDays }}{% endraw %} days · Daily limit: {% raw %}{{ dailyTranslationLimit > 0 ? dailyTranslationLimit + ' items' : 'unlimited' }}{% endraw %} (<a href="/settings">change</a>)</p>
      <p class="field-hint" v-if="nextRun">Next scheduled run: {% raw %}{{ nextRun }}{% endraw %}</p>
      <div class="field-row">
        <button class="btn btn-primary" @click="runNow" :disabled="runActive || running">
          {% raw %}{{ runActive ? 'Run in progress…' : (running ? 'Starting…' : 'Run now') }}{% endraw %}
        </button>
        <span v-if="runStarted" class="test-result">● started</span>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <div class="panel-body">
    <div class="panel-title">Sync wanted / missing from Bazarr</div>
    <div class="panel-title-sub">Refreshes the wanted-subtitle list — no subtitle content is fetched, no translation runs</div>


      <p class="field-hint">Cron: <span class="mono">{% raw %}{{ syncMediaCron || 'not scheduled' }}{% endraw %}</span> (<a href="/settings">change</a>)</p>
      <p class="field-hint" v-if="nextSyncMediaRun">Next scheduled run: {% raw %}{{ nextSyncMediaRun }}{% endraw %}</p>
      <div class="field-row">
        <button class="btn" @click="syncMedia" :disabled="syncMediaActive || syncingMedia || runActive">
          {% raw %}{{ syncMediaActive ? 'Syncing…' : (syncingMedia ? 'Starting…' : 'Sync wanted / missing') }}{% endraw %}
        </button>
        <span v-if="syncMediaStarted" class="test-result">● started</span>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <div class="panel-body">
    <div class="panel-title">Pull pending subtitles (sources) from Bazarr</div>
    <div class="panel-title-sub">Pre-fetches source subtitle content for every pending item into the local cache — no translation, no uploads</div>


      <p class="field-hint">Cron: <span class="mono">{% raw %}{{ syncSubsCron || 'not scheduled' }}{% endraw %}</span> (<a href="/settings">change</a>)</p>
      <p class="field-hint" v-if="nextSyncSubsRun">Next scheduled run: {% raw %}{{ nextSyncSubsRun }}{% endraw %}</p>
      <div class="field-row">
        <button class="btn" @click="syncSubs" :disabled="syncSubsActive || syncingSubs || runActive">
          {% raw %}{{ syncSubsActive ? 'Pulling…' : (syncingSubs ? 'Starting…' : 'Pull pending subtitles') }}{% endraw %}
        </button>
        <span v-if="syncSubsStarted" class="test-result">● started</span>
      </div>
      <p class="field-hint" v-if="syncSubsResult">
        ● resolved {% raw %}{{ syncSubsResult.resolved }}{% endraw %} items,
        cached {% raw %}{{ syncSubsResult.cached }}{% endraw %} source subtitles
      </p>
    </div>
  </div>

  <div class="panel" style="margin-top:16px;" v-if="queueUploadsEnabled || pendingUploadCount > 0">
    <div class="panel-body">
    <div class="panel-title">Push queued uploads</div>
    <div class="panel-title-sub">Sends every translated subtitle currently held as "pending upload" to Bazarr in one batch</div>
      <p class="field-hint">{% raw %}{{ pendingUploadCount }}{% endraw %} item{% raw %}{{ pendingUploadCount === 1 ? '' : 's' }}{% endraw %} waiting to be pushed.</p>
      <div class="field-row">
        <button class="btn" @click="pushUploads" :disabled="pushUploadsActive || pushingUploads || pendingUploadCount === 0">
          {% raw %}{{ pushUploadsActive ? 'Pushing…' : (pushingUploads ? 'Starting…' : 'Push queued uploads') }}{% endraw %}
        </button>
        <span v-if="pushUploadsStarted" class="test-result">● started</span>
      </div>
      <p class="field-hint" v-if="pushUploadsResult">
        ● pushed {% raw %}{{ pushUploadsResult.pushed }}{% endraw %},
        failed {% raw %}{{ pushUploadsResult.failed }}{% endraw %}<template v-if="pushUploadsResult.reset">,
        reset {% raw %}{{ pushUploadsResult.reset }}{% endraw %} for re-translation (queued file was missing)</template>
      </p>
    </div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <div class="panel-body">
    <div class="panel-title">Language check</div>
    <div class="panel-title-sub">Audits completed translations' ACTUAL output language against their target — catches a well-formed response that's silently still in the source language, which the normal alignment/integrity checks can't detect</div>

      <p class="field-hint">
        Sends one batched request per run ("here are N files' sample text, what language is each") to a
        SINGLE chosen engine, checking up to 25 not-yet-checked completed items at once — cheap on
        request quota even for a large backlog, since it's one call regardless of how many items it covers.
      </p>
      <div class="field-row">
        <div class="field" style="max-width:320px;">
          <label>Engine to check with</label>
          <select v-model.number="languageCheckInstanceId" @change="saveLanguageCheckInstance">
            <option :value="null" disabled>Pick an engine…</option>
            <option v-for="inst in engineInstances" :key="inst.id" :value="inst.id">{% raw %}{{ inst.name }}{% endraw %}</option>
          </select>
        </div>
      </div>
      <p class="field-hint">{% raw %}{{ languageCheckPendingCount }}{% endraw %} item{% raw %}{{ languageCheckPendingCount === 1 ? '' : 's' }}{% endraw %} not yet checked.</p>
      <div class="field-row">
        <button class="btn" @click="runLanguageCheck" :disabled="languageCheckActive || startingLanguageCheck || !languageCheckInstanceId || languageCheckPendingCount === 0">
          {% raw %}{{ languageCheckActive ? 'Checking…' : (startingLanguageCheck ? 'Starting…' : 'Run language check') }}{% endraw %}
        </button>
        <span v-if="languageCheckStarted" class="test-result">● started</span>
      </div>
      <p class="field-hint" v-if="languageCheckResult">
        ● {% raw %}{{ languageCheckActive ? 'so far: ' : '' }}{% endraw %}checked {% raw %}{{ languageCheckResult.checked }}{% endraw %},
        {% raw %}{{ languageCheckResult.matched }}{% endraw %} ok,
        {% raw %}{{ languageCheckResult.mismatched }}{% endraw %} mismatch<template v-if="languageCheckResult.skipped">,
        {% raw %}{{ languageCheckResult.skipped }}{% endraw %} skipped</template>
      </p>
      <p class="field-hint error" v-if="languageCheckError">● {% raw %}{{ languageCheckError }}{% endraw %}</p>
    </div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <div class="panel-body">
    <div class="panel-title">Fix broken runs</div>
    <div class="panel-title-sub">Closes out run history entries left stuck "in progress" by a process that was killed mid-batch — does not delete anything</div>


      <p class="field-hint">
        Safe to run any time. Runs automatically on every server startup already; this lets you
        trigger it on demand instead of waiting for a restart. Items and their history stay
        exactly as they are — this only marks abandoned runs as finished so they stop showing
        as active on the History page.
      </p>
      <div class="field-row">
        <button class="btn" @click="fixStaleRuns" :disabled="fixingStaleRuns || runActive">
          {% raw %}{{ fixingStaleRuns ? 'Fixing…' : 'Fix broken runs' }}{% endraw %}
        </button>
      </div>
      <p class="field-hint" v-if="fixStaleRunsResult">
        {% raw %}{{ fixStaleRunsResult.closed > 0 ? `● closed ${fixStaleRunsResult.closed} stuck run(s)` : '● nothing to fix — no broken runs found' }}{% endraw %}
      </p>
    </div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <div class="panel-body">
    <div class="panel-title">Clear engine rate limits</div>
    <div class="panel-title-sub">Immediately un-flags every engine currently in a 24h rate-limit cooldown</div>


      <p class="field-hint">
        An engine gets auto-flagged after 3 consecutive failures against it — usually genuine
        exhaustion, but a short burst-limit blip can occasionally look the same. Use this after
        confirming (e.g. on the provider's own usage dashboard) that an engine actually has
        headroom left, instead of waiting out the full 24h or re-editing its config just to
        trigger a Test Connection. No cron — this only runs when you click it.
      </p>
      <div class="field-row">
        <button class="btn" @click="clearRateLimits" :disabled="clearingRateLimits">
          {% raw %}{{ clearingRateLimits ? 'Clearing…' : 'Clear all rate limits' }}{% endraw %}
        </button>
      </div>
      <p class="field-hint" v-if="clearRateLimitsResult">
        {% raw %}{{ clearRateLimitsResult.cleared > 0 ? `● cleared ${clearRateLimitsResult.cleared} engine(s)` : '● nothing to clear — no engines currently rate-limited' }}{% endraw %}
      </p>
    </div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <div class="panel-body">
    <div class="panel-title">Reset local data</div>
    <div class="panel-title-sub">Clears queue and run history — does not touch any saved settings</div>


      <p class="field-hint">
        Wipes tracked items, run history, and per-item logs from this local database, then
        re-populates from Bazarr on the next poll or run. Use this to fix mismatched or
        confusing local state. Bazarr connection, engine, and schedule settings are untouched.
      </p>
      <div class="field-row" v-if="!confirmingClear">
        <button class="btn" @click="confirmingClear = true" :disabled="runActive">Clear database</button>
      </div>
      <div class="field-row" v-else>
        <span class="field-hint" style="margin:0;">Clear all queue/run history? This cannot be undone.</span>
        <button class="btn" style="border-color:var(--bad); color:var(--bad);" @click="clearDatabase" :disabled="clearing">
          {% raw %}{{ clearing ? 'Clearing…' : 'Yes, clear it' }}{% endraw %}
        </button>
        <button class="btn" @click="confirmingClear = false" :disabled="clearing">Cancel</button>
      </div>
      <p class="field-hint" v-if="clearResult">
        ● cleared {% raw %}{{ clearResult.items_cleared }}{% endraw %} items,
        {% raw %}{{ clearResult.runs_cleared }}{% endraw %} runs,
        {% raw %}{{ clearResult.logs_cleared }}{% endraw %} log entries
      </p>
      <p class="field-hint error" v-if="error">● {% raw %}{{ error }}{% endraw %}</p>
    </div>
  </div>
  </template>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/jobs.js?v={{ asset_version }}"></script>
{% endblock %}
