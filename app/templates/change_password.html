<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtitlarr — Change password</title>
  <link rel="icon" href="/static/icon.svg?v={{ asset_version }}" />
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_version }}" />
  <link rel="stylesheet" href="/static/css/base.css?v={{ asset_version }}" />
  <link rel="stylesheet" href="/static/css/components.css?v={{ asset_version }}" />
  <script src="/static/js/vue.global.prod.js?v={{ asset_version }}"></script>
</head>
<body>
  <div class="auth-page">
    <div id="change-password-app" class="panel auth-panel">
      <div class="panel-body">
        <div class="panel-title">Set a new password</div>
        <div class="panel-title-sub">You're still using the default admin password — choose a real one before continuing.</div>

        <form @submit.prevent="submit">
          <div class="field">
            <label>Current password</label>
            <input type="password" v-model="currentPassword" autocomplete="current-password" autofocus required>
          </div>
          <div class="field">
            <label>New password</label>
            <input type="password" v-model="newPassword" autocomplete="new-password" required>
          </div>
          <p class="field-hint error" v-if="error">● {% raw %}{{ error }}{% endraw %}</p>
          <button class="btn" type="submit" :disabled="loading">{% raw %}{{ loading ? 'Saving…' : 'Save and continue' }}{% endraw %}</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return { currentPassword: "", newPassword: "", error: "", loading: false };
      },
      methods: {
        async submit() {
          this.loading = true;
          this.error = "";
          try {
            const resp = await fetch("/api/auth/change-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ current_password: this.currentPassword, new_password: this.newPassword }),
            });
            const data = await resp.json();
            if (!resp.ok) {
              this.error = data.detail || "Could not change password.";
              return;
            }
            window.location.href = data.redirect;
          } catch (err) {
            this.error = "Could not reach the server.";
          } finally {
            this.loading = false;
          }
        },
      },
    }).mount("#change-password-app");
  </script>
</body>
</html>
