{% extends "base.html" %}
{% block title %}Language Rules{% endblock %}
{% block content %}
<div id="languages-app">
  <div class="page-head">
    <div>
      <h1>Language Rules</h1>
      <p class="page-sub">Optional: which existing language to prefer as a translation source, when an item has more than one.</p>
    </div>
  </div>

  <div class="panel-loading" v-if="pageLoading">
    <div class="loading-spinner"></div>
    <p>Loading language rules…</p>
  </div>

  <template v-else>
  <div class="panel">
    <div class="panel-body">
    <div class="panel-title">Source language priority</div>
    <div class="panel-title-sub">
      A preference, not a requirement — leave empty and Subtitlarr uses whatever language each item
      already has. Add languages here only to control which one wins when an item has several
      (e.g. prefer English over Italian when both exist).
    </div>

    <div class="tag-input-list">
      <span class="tag-chip" v-for="(lang, i) in sourcePriority" :key="lang">
        {% raw %}{{ i + 1 }}. {{ lang.toUpperCase() }}{% endraw %}
        <span class="remove" @click="removeSource(i)">×</span>
      </span>
    </div>
    <div class="field-row" style="margin-top:0;">
      <input v-model="newSourceLang" placeholder="e.g. en" class="inline-input" style="max-width:120px;"
             @keyup.enter="addSource" />
      <button class="btn" @click="addSource">Add</button>
    </div>
    </div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <div class="panel-body">
    <div class="panel-title" style="margin-bottom:4px;">Regional variants</div>
    <p class="field-hint" style="margin-top:0;">A bare language code (e.g. "es") is ambiguous whenever a language has more than one widely-used regional standard — Bazarr's own language codes don't distinguish es-ES from es-MX, for example. Each row below picks which standard to explicitly request when translating into that language. Only languages with a small number of clearly dominant standards are covered; every other language is left alone.</p>
    <div v-for="code in variantLanguageCodes" :key="code" class="field" style="max-width:320px;">
      <label>{% raw %}{{ languageName(code) }}{% endraw %} ({% raw %}{{ code }}{% endraw %})</label>
      <select :value="variantFor(code)" @change="setVariant(code, $event.target.value)">
        <option v-for="(label, key) in availableVariants[code]" :key="key" :value="key">
          {% raw %}{{ label }}{% endraw %}{% raw %}{{ key === variantDefaults[code] ? ' (default)' : '' }}{% endraw %}
        </option>
      </select>
    </div>
    </div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <div class="panel-body">
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
      <input type="checkbox" v-model="catalanVegetaInsults" style="width:auto;" />
      Vegeta-style insults for Catalan
    </label>
    <p class="field-hint">When translating into Catalan, adapt insults and profanity into the proud, colorful, non-literal style of Vegeta's Catalan dub (TV3's Bola de Drac Z) instead of a literal translation. Doesn't affect any other language.</p>
    </div>
  </div>

  <div class="field-row" style="margin-top:16px;">
    <button class="btn btn-primary" @click="save" :disabled="saving">
      {% raw %}{{ saving ? 'Saving…' : 'Save' }}{% endraw %}
    </button>
    <span v-if="saved" class="test-result">● saved</span>
  </div>
  </template>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/languages.js?v={{ asset_version }}"></script>
{% endblock %}
