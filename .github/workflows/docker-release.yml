name: Docker release

on:
  push:
    tags:
      - "v*.*.*"
      - "dev-v*.*.*"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        # dev-v0.14.0 -> is_dev=true. Always pushed as the single fixed
        # tag `dev` (not the literal dev-v0.14.0 tag name) — the whole
        # point is a stable tag the NAS points at once and never has to
        # update; each new dev-v*.*.* push just moves `dev` forward.
        # Never touches `latest` or a bare version tag.
        # v0.14.0 -> is_dev=false, version=0.14.0 (existing behavior,
        # unchanged: pushed as both `latest` and the version number).
        run: |
          if [[ "$GITHUB_REF_NAME" == dev-v* ]]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.is_dev == 'false' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_dev == 'false' }}
            type=raw,value=dev,enable=${{ steps.version.outputs.is_dev == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TELEMETRY_MEASUREMENT_ID=${{ secrets.TELEMETRY_MEASUREMENT_ID }}
            TELEMETRY_API_SECRET=${{ secrets.TELEMETRY_API_SECRET }}
