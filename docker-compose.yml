services:
  subtitlarr:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BAZARR_BASE_URL=${BAZARR_BASE_URL}
      - BAZARR_API_KEY=${BAZARR_API_KEY}
      - ACTIVE_ENGINE=${ACTIVE_ENGINE:-ollama}
      - FALLBACK_ENGINE=${FALLBACK_ENGINE:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_BATCH_TOKEN_BUDGET=${OLLAMA_BATCH_TOKEN_BUDGET:-0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-deepseek-ai/deepseek-v4-flash}
      - NVIDIA_BATCH_TOKEN_BUDGET=${NVIDIA_BATCH_TOKEN_BUDGET:-2000}
      - SCHEDULE_CRON=${SCHEDULE_CRON:-0 3 * * *}
      - AGE_THRESHOLD_DAYS=${AGE_THRESHOLD_DAYS:-14}
      - DAILY_TRANSLATION_LIMIT=${DAILY_TRANSLATION_LIMIT:-100}
      - PAUSE_BETWEEN_ITEMS_SECONDS=${PAUSE_BETWEEN_ITEMS_SECONDS:-30}
      - QUEUE_UPLOADS_ENABLED=${QUEUE_UPLOADS_ENABLED:-false}
      - SYNC_MEDIA_CRON=${SYNC_MEDIA_CRON:-40 9 * * *}
      - SYNC_SUBS_CRON=${SYNC_SUBS_CRON:-40 9 * * *}
      - DB_PATH=/data/subtitlarr.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Local-dev convenience only, and only relevant if ACTIVE_ENGINE=ollama —
  # not a hard dependency of subtitlarr (no depends_on above), since Gemini
  # and NVIDIA need no local model server at all. On a real deployment
  # (e.g. Unraid), Ollama usually already runs as its own existing
  # container — point OLLAMA_BASE_URL at that container instead of
  # defining a service here, and remove this block entirely.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
