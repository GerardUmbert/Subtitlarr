services:
  subtitlarr:
    build: .
    ports:
      - "7777:7777"
    environment:
      - SCHEDULE_CRON=${SCHEDULE_CRON:-0 3 * * *}
      - AGE_THRESHOLD_DAYS=${AGE_THRESHOLD_DAYS:-14}
      - DAILY_TRANSLATION_LIMIT=${DAILY_TRANSLATION_LIMIT:-100}
      - PAUSE_BETWEEN_ITEMS_SECONDS=${PAUSE_BETWEEN_ITEMS_SECONDS:-30}
      - QUEUE_UPLOADS_ENABLED=${QUEUE_UPLOADS_ENABLED:-false}
      - SYNC_MEDIA_CRON=${SYNC_MEDIA_CRON:-40 9 * * *}
      - SYNC_SUBS_CRON=${SYNC_SUBS_CRON:-40 9 * * *}
      - DB_PATH=/data/subtitlarr.db
      # The container starts as root, chowns /data to PUID:PGID, then
      # drops to that user before running the app — set these to match
      # whatever owns ./data on THIS host if you hit permission errors
      # (defaults to 1000:1000, the image's baked-in user).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Local-dev convenience only — not a hard dependency of subtitlarr (no
  # depends_on above), since cloud engines (Gemini/NVIDIA/etc.) need no
  # local model server at all. Add an Ollama engine instance from the
  # Translation Engine page pointing at http://ollama:11434 to use it. On
  # a real deployment (e.g. Unraid), Ollama usually already runs as its
  # own existing container — point the engine instance's base URL at that
  # container instead of defining a service here, and remove this block
  # entirely.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
